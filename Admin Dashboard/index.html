<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Moon & Mug</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <!-- Dynamic Header with Return Button -->
        <div class="item header">
            <div class="header-left">
                <a href="../Home Page/index.html" class="back-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Home
                </a>
                <h2 id="welcome-text">Admin Control Panel</h2>
            </div>

            <div class="profile-section">
                <span id="user-profile-name" class="user-name">Admin</span>
                <a href="../Login Page/index.html" id="logout-btn" class="logout-btn">Log out</a>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="item sidebar">
            <ul class="nav-links">
                <li><a href="#" class="active">Sales Dashboard</a></li>
                <li><a href="#">Manage Inventory</a></li>
                <li><a href="#">Staff Accounts</a></li>
                <li><a href="#">System Settings</a></li>
                <li style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                    <a href="../Home Page/index.html" class="return-nav-link">← Return to POS</a>
                </li>
            </ul>
        </div>

        <!-- Content Area -->
        <div class="item content">
            <div class="dashboard-header">
                <h3>Sales Overview</h3>
                <!-- NEW: Time Filters -->
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="daily">Daily</button>
                    <button class="filter-btn" data-filter="weekly">Weekly</button>
                    <button class="filter-btn" data-filter="monthly">Monthly</button>
                    <button class="filter-btn" data-filter="annually">Annually</button>
                    <button class="filter-btn" data-filter="all">All Time</button>
                </div>
            </div>
            
            <!-- Summary Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Total Revenue</h4>
                    <p id="total-revenue">₱0.00</p>
                </div>
                <div class="stat-card">
                    <h4>Total Orders</h4>
                    <p id="total-orders">0</p>
                </div>
            </div>

            <h3 style="margin-top: 30px; margin-bottom: 15px;">
                Transaction History <span id="current-filter-label" style="color: #64748b; font-size: 16px;">(Daily)</span>
            </h3>
            
            <!-- Sales Table -->
            <div class="table-container">
                <table class="sales-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Cashier</th>
                            <th>Items Sold</th>
                            <th>Total Amount</th>
                        </tr>
                    </thead>
                    <tbody id="sales-table-body">
                        <!-- JavaScript will inject sales here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Link to external JS -->
    <script src="script.js"></script>
</body>
</html>
