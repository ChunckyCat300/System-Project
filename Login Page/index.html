<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="login-card">
            
            <div class="icon-container">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <h2>Welcome!</h2>
            <p class="subtitle">Sign in to your account to continue</p>

            <form id="loginForm">
                
                <div class="input-group">
                    <label for="email">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="text" id="email" placeholder="Username" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        
                        <input type="password" id="password" placeholder="Enter your password" required>
                        
                     <span class="right-icon" id="togglePasswordBtn" style="cursor: pointer;">
    
                  <svg id="eye-open" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
         <circle cx="12" cy="12" r="3"></circle>
     </svg>
    
     <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
         <line x1="1" y1="1" x2="23" y2="23"></line>
             </svg>
        </span>

             </div>
                  </div>

                <p id="error-msg" style="color: #ef4444; font-size: 14px; margin-bottom: 10px; display: none; text-align: center;"></p>

                <button type="submit" class="login-btn">Sign in</button>
            </form>

            <p class="signup-text">Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
        </div>
        

    <script>
        // --- 1. EXISTING PASSWORD TOGGLE LOGIC ---
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        toggleBtn.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            if (isPassword) {
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        });

        // --- 2. NEW LOGIN VERIFICATION LOGIC ---
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('email'); 
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', function (event) {
            // Prevent the form from refreshing the page immediately
            event.preventDefault(); 
            
            // Get the text the user typed
            const enteredUsername = usernameInput.value;
            const enteredPassword = passwordInput.value;

            // Check for Admin
            if (enteredUsername === 'admin' && enteredPassword === '1234') {
                window.location.href = '../Home Page/index.html'; 
            } 
            // Check for Staff
            else if (enteredUsername === 'staff' && enteredPassword === '1234') {
                window.location.href = '../Home Page/index.html';
            } 
            // If neither matches, show error
            else {
                errorMsg.textContent = 'Invalid username or password.';
                errorMsg.style.display = 'block'; // Make the error visible
                
                // Add a red border to the inputs to show failure
                usernameInput.style.borderColor = '#ef4444';
                passwordInput.style.borderColor = '#ef4444';
            }
        });
        
        // Hide the error message again as soon as they start typing
        usernameInput.addEventListener('input', hideError);
        passwordInput.addEventListener('input', hideError);
        
        function hideError() {
            errorMsg.style.display = 'none';
            usernameInput.style.borderColor = 'var(--border-color)';
            passwordInput.style.borderColor = 'var(--border-color)';
        }
    </script>
</body>
</html>
